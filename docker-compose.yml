version: "3.8"

services:
  app:
    build: .
    container_name: orehack-app
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped
    volumes:
      # Optional: uncomment to mount code for hot-reloading
      # - .:/app
      - /app/.venv # Prevent local virtual env from overriding container
    
  ollama:
    image: ollama/ollama:latest
    container_name: orehack-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Uncomment the following lines if you have an NVIDIA GPU and Docker NVIDIA toolkit installed:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama_data:
